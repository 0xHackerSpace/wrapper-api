      summary: Lista colaboradores do grafo
      description: "Requer JWT + permission `graph:read`. Papel minimo no grafo: `viewer`."
      tags: [graph]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de colaboradores.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessEntry"
                  count: { type: integer }
        "404":
          description: Grafo inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/graphs/{graphId}/access/{userId}:
    parameters:
      - name: graphId
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: putV1GraphAccessByUserId
      summary: Concede ou atualiza o papel de um colaborador (upsert)
      description: |
        Requer JWT + permission `graph:write`. Papel minimo no grafo: `owner`. Retorna
        409 se a operacao deixaria o grafo sem nenhum `owner`.
      tags: [graph]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRoleInput"
            example:
              role: editor
      responses:
        "200":
          description: Acesso concedido/atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/AccessEntry"
        "403":
          description: Chamador nao e owner do grafo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Grafo inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: O grafo ficaria sem nenhum owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "Graph must have at least one owner", type: invalid_request_error }
    delete:
      operationId: deleteV1GraphAccessByUserId
      summary: Remove o acesso de um colaborador
      description: |
        Auto-remocao (o proprio usuario) requer apenas `graph:read`, sem checagem de
        owner. Remocao de outro usuario requer `graph:write` + papel `owner` no grafo.
      tags: [graph]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso removido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "404":
          description: Grafo ou acesso inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ingest:
    post:
      operationId: postIngest
      summary: Ingesta um documento de texto (chunking + embeddings + R2 + Vectorize)
      description: |
        Requer JWT + permission `rag:ingest` -- exceto quando `JWT_SECRET` nao esta
        configurado no worker (fallback usado em dev), caso em que a autenticacao e
        pulada. `text` e obrigatorio, maximo de 512KB. Dispara, em segundo plano
        (`ctx.waitUntil`), extracao de entidades e sincronizacao com o graph-worker
        (grafo `graphId`, default `"rag-documents"`) -- best effort, nao bloqueia a resposta.
      tags: [rag]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID opcional; deve casar com [A-Za-z0-9][A-Za-z0-9._-]{0,127}. Gerado (UUID) se omitido.
                text:
                  type: string
                  maxLength: 524288
                source:
                  type: string
                metadata:
                  type: object
                  description: Ate 16 propriedades string/number/boolean; chaves reservadas (documentId, chunkIndex, source, text) nao sao permitidas.
                graphId:
                  type: string
                  default: rag-documents
              required: [text]
            examples:
              defaultGraph:
                summary: graphId default (rag-documents)
                value:
                  text: "Alho é um tempero versátil usado em muitas culinárias..."
                  source: wikipedia
                  metadata:
                    type: ingredient
              explicitGraph:
                summary: graphId explicito
                value:
                  text: "Alho combina bem com azeite, limão e ervas frescas em receitas mediterrâneas."
                  source: wikipedia
                  graphId: ingredients
                  metadata:
                    type: ingredient
      responses:
        "201":
          description: Documento ingerido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string }
                  chunks: { type: integer }
                  vectorIds:
                    type: array
                    items: { type: string }
                  objects:
                    type: object
                    properties:
                      source: { type: string }
                      manifest: { type: string }
                  mutationId:
                    type: string
                    nullable: true
        "400":
          description: Campo `text` ausente/vazio, `metadata` invalida, ou `id`/`graphId` malformado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "field 'text' is required and must be a non-empty string"
        "401":
          description: Sem token de autenticacao (quando JWT_SECRET esta configurado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "413":
          description: Texto acima de 512KB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /query:
    post:
      operationId: postQuery
      summary: Busca semantica + geracao de resposta (RAG)
      description: |
        Requer JWT + permission `rag:query` -- exceto quando `JWT_SECRET` nao esta
        configurado no worker (fallback usado em dev). `question` e obrigatorio,
        maximo de 2000 caracteres.
      tags: [rag]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  maxLength: 2000
                topK:
                  type: integer
                  default: 5
                filter:
                  type: object
              required: [question]
            example:
              question: "Como preparar alho?"
              topK: 5
      responses:
        "200":
          description: Resposta gerada a partir do contexto recuperado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: string }
                  answer: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        score: { type: number }
                        documentId: { type: string, nullable: true }
                        chunkIndex: { type: integer, nullable: true }
                        source: { type: string, nullable: true }
        "400":
          description: Campo `question` ausente/vazio, ou `filter` invalido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "field 'question' is required and must be a non-empty string"
        "401":
          description: Sem token de autenticacao (quando JWT_SECRET esta configurado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "413":
          description: Pergunta acima de 2000 caracteres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /v1/graphrag/query:
    post:
      operationId: postV1GraphragQuery
      summary: Q&A hibrido (busca vetorial + travessia do grafo)
      description: |
        Requer JWT + permission `graphrag:query`. Combina `RAG_WORKER.query()` (busca
        vetorial), extracao de entidades via `AI_WORKER` e travessia estrutural via
        `GRAPH_WORKER.findNodeByLabel()`/`findPaths()` (best-effort: falhas de lookup no
        grafo degradam para "sem contexto estrutural para essa entidade", sem falhar a
        request inteira). `question` e obrigatorio, maximo de 2000 caracteres. `graphId`
        default `"rag-documents"`, `maxDepth` default 2.
      tags: [graphrag]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  maxLength: 2000
                graphId:
                  type: string
                  default: rag-documents
                maxDepth:
                  type: integer
                  default: 2
                topK:
                  type: integer
              required: [question]
            examples:
              ingredientsGraph:
                summary: Sobre o grafo "ingredients" (recomendacoes do api-worker)
                value:
                  question: "Com que ingredientes o alho combina bem?"
                  graphId: ingredients
                  topK: 5
                  maxDepth: 2
              defaultGraph:
                summary: Sobre o grafo default (rag-documents)
                value:
                  question: "Como o alho é usado na culinária mediterrânea?"
              missingQuestion:
                summary: question ausente (400)
                value:
                  graphId: ingredients
      responses:
        "200":
          description: Resposta hibrida, com fontes vetoriais e contexto estrutural do grafo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: string }
                  answer: { type: string }
                  sources:
                    type: array
                    items:
                      type: object
                  graphContext:
                    type: array
                    items:
                      type: object
                    description: Vazio quando nenhuma entidade da pergunta foi encontrada no grafo (resposta baseada so no contexto vetorial).
        "400":
          description: Campo `question` ausente/vazio ou acima de 2000 caracteres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "field 'question' is required and must be a non-empty string", type: invalid_request_error }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Token valido mas sem a permission `graphrag:query`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
