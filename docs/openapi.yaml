        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: to
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: getV1GraphNodeRelations
      summary: Relacoes diretas entre dois nodes
      description: "Requer JWT + permission `graph:read`. Papel minimo no grafo: `viewer`."
