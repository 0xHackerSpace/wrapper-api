      description: |
        Requer JWT + permission `ai:agents`. O criador vira `owner` do agent.
        `tools`, quando enviado, e validado contra o catalogo fixo de tools do
        ai-worker (ADR 0023) -- nome desconhecido retorna 400. `graph_id`
