        Requer JWT + permission `ai:teams`. Requer papel `owner` quando removendo
        outro usuario; auto-remocao (o proprio usuario) e permitida em qualquer
        papel, sem checagem de owner.
      tags: [ai]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso removido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "404":
          description: Team ou acesso inexistente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A remocao deixaria o team sem nenhum owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/graphs:
    post:
