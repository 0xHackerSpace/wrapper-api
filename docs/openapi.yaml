            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getV1Graphs
      summary: Lista grafos que o usuario tem acesso
      description: Requer JWT + permission `graph:read`. Lista grafos com qualquer papel em `graph_access`.
      tags: [graph]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de grafos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Graph"
