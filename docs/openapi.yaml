          description: Team criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Campo obrigatorio ausente/invalido para o `orchestration_mode` enviado, ou `lead_agent_id` fora de `members`.
