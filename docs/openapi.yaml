      summary: Cria um team
      description: |
        Requer JWT + permission `ai:teams`. O criador vira `owner` do team. Campos
        obrigatorios/proibidos variam por `orchestration_mode` -- ver
        `TeamInput` e ADR 0025. `lead_agent_id` sempre precisa estar em `members`.
