        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
            examples:
              pipeline:
                summary: Team pipeline (cadeia sequencial)
                value:
                  name: "Pipeline de revisao de receitas"
                  orchestration_mode: pipeline
                  members:
                    - agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
                      order_index: 0
              debate:
                summary: Team debate (discussao em rodadas)
                value:
                  name: "Debate de receitas"
                  orchestration_mode: debate
                  members:
                    - agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
                      order_index: 0
                  lead_agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
                  rounds: 3
                  termination_strategy: moderator
              orchestrator:
                summary: Team orchestrator (coordenador dirige quem fala)
                value:
                  name: "Coordenador de receitas"
                  orchestration_mode: orchestrator
                  members:
                    - agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
                      order_index: 0
                  lead_agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
                  max_orchestrator_steps: 10
