            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Pagina de mensagens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  next_cursor:
                    type: string
                    nullable: true
        "404":
          description: Sessao inexistente ou sem chat_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
