openapi: 3.1.0
info:
  title: Wrapper API
  version: "1.0.0"
  description: |
    Documento OpenAPI unico cobrindo a superficie HTTP real dos 6 Cloudflare Workers do
    projeto (`auth`, `api`, `ai`, `graph`, `rag`, `graphrag`). Mantido a mao, alinhado ao
    codigo em `terraform/workers/{worker}/{src/,}index.mjs` -- ver `docs/specs/openapi-documentation.md`
    para a spec que motivou este documento.

    ## Fora de escopo: RPC via Service Binding

    `ai-worker` (`chat()`), `graph-worker` (`upsertNode`, `updateNode`, `deleteNode`,
    `createEdge`, `getNeighbors`, `findPaths`, `findNodeByLabel`) e `rag-worker` (`query()`)
    tambem sao `WorkerEntrypoint` e expoem metodos RPC adicionais, alcancaveis apenas via
    Service Binding entre Workers da mesma conta Cloudflare -- nunca via HTTP. OpenAPI e um
    formato de descricao de API HTTP, portanto esses metodos RPC NAO aparecem em `paths`
    abaixo. Ver ADR 0015 (Service Bindings + RPC) e ADR 0016 (grafos por domínio e
    enriquecimento via RAG) para o contrato desses metodos.

    ## Rotas duplicadas entre workers (`/health`, `/`, `/v1`)

    `GET /health` existe, com o mesmo path literal, nos 6 workers; `GET /` existe em
    `auth`, `api`, `ai` e `graph`; `GET /v1` existe em `ai` e `graph` como alias do mesmo
    handler de `GET /`. OpenAPI nao permite duas operacoes distintas sob a mesma chave
    `path`+metodo no mesmo documento, entao essas rotas aparecem como uma unica operacao
    cada, com `tags` listando todos os workers que a implementam e um `examples` nomeado
    por worker mostrando o corpo real retornado por cada um.

    ## Erros: dois formatos, sem unificar

    - `auth-worker`, `api-worker` e `rag-worker` retornam `{ "error": "mensagem" }` (string
      plana) -- ver `AuthErrorResponse`.
    - `ai-worker`, `graph-worker` e `graphrag-worker` retornam
      `{ "error": { "message": "...", "type": "invalid_request_error" } }` -- ver
      `ErrorResponse`.

    Essa classificacao foi verificada linha a linha em cada `lib/response.mjs` /
    `lib/auth.mjs` de cada worker (nao e a mesma divisao 1-vs-5 as vezes assumida
    informalmente; `api` e `rag` de fato usam o formato plano, igual a `auth`).
servers:
  - url: https://dev-api.0xhackerspace.workers.dev
    description: api-worker (dev)
  - url: https://dev-auth.0xhackerspace.workers.dev
    description: auth-worker (dev)
  - url: https://dev-ai.0xhackerspace.workers.dev
    description: ai-worker (dev)
  - url: https://dev-graph.0xhackerspace.workers.dev
    description: graph-worker (dev)
  - url: https://dev-rag.0xhackerspace.workers.dev
    description: rag-worker (dev)
  - url: https://dev-graphrag.0xhackerspace.workers.dev
    description: graphrag-worker (dev)
tags:
  - name: auth
    description: auth-worker -- JWT, signup/login/refresh, estatisticas de usuarios.
  - name: api
    description: api-worker -- CRUD de ingredientes e recomendacoes via graph-worker.
  - name: ai
    description: ai-worker -- chat completions compativeis com OpenAI, sessoes de chat persistentes, agents reutilizaveis.
  - name: graph
    description: graph-worker -- grafo de conhecimento (grafos, nodes, edges, ACL).
  - name: rag
    description: rag-worker -- ingestao e busca semantica (Vectorize + BGE embeddings).
  - name: graphrag
    description: graphrag-worker -- Q&A hibrido (RAG + travessia do grafo).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthErrorResponse:
      type: object
      description: Formato de erro usado por auth-worker, api-worker e rag-worker.
      properties:
        error:
          type: string
      required: [error]
    ErrorResponse:
      type: object
      description: Formato de erro usado por ai-worker, graph-worker e graphrag-worker.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: invalid_request_error
          required: [message, type]
      required: [error]
    Ingredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        slug:
          type: string
        type:
          type: string
        reference:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        permissions:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, nome, slug, type]
    IngredientInput:
      type: object
      properties:
        nome:
          type: string
        slug:
          type: string
        type:
          type: string
        reference:
          type: string
        url:
          type: string
        permissions:
          type: string
      required: [nome, slug, type]
    IngredientUpdateInput:
      type: object
      description: Todos os campos sao opcionais; apenas os enviados sao atualizados.
      properties:
        nome:
          type: string
        slug:
          type: string
        type:
          type: string
        reference:
          type: string
        url:
          type: string
        permissions:
          type: string
    ChatSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        title:
          type: string
          nullable: true
        agent_id:
          type: string
          format: uuid
          nullable: true
          description: Agent referenciado na criacao da sessao (ADR 0022), se algum. Config congelada em snapshot, nao exposta aqui.
        team_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Team referenciado na criacao da sessao (ADR 0025), se algum. Mutuamente
            exclusivo com `agent_id`. Diferente de `agent_id`, e uma referencia viva,
            sem snapshot: editar o team depois afeta a proxima mensagem enviada nesta
            sessao.
        created_at:
          type: string
        updated_at:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required: [id, user_id, created_at, updated_at]
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        agent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Qual membro do team (ADR 0025) produziu esta mensagem, quando ela vem de
            dentro de uma orquestracao de team. `null` para mensagens de sessao com
            agent unico ou sem agent.
        created_at:
          type: string
      required: [id, session_id, role, content, created_at]
    ChatCompletionMessageInput:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
      required: [role, content]
    Agent:
      type: object
      description: |
        Configuracao de IA reutilizavel (system prompt + parametros de geracao) --
        ver ADR 0022. Pode ser referenciada por `agent_id` ao criar uma sessao de
        chat, que copia estes campos como um snapshot congelado. `tools` e
        `max_tool_iterations` (ADR 0023) habilitam tool calling nas mensagens de
        sessoes que referenciam este agent -- ver `POST /v1/sessions/{id}/messages`.
        `graph_id` (ADR 0024) e o grafo de conhecimento fixo usado pela tool
        `find_node`, quando habilitada.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        temperature:
          type: number
          nullable: true
        max_tokens:
          type: integer
          nullable: true
        top_p:
          type: number
          nullable: true
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Nomes de tools habilitadas (ex.: `["query_knowledge_base"]`), validados
            contra o catalogo fixo de tools do ai-worker (ADR 0023). `null` ou
            ausente significa nenhuma tool habilitada.
          example: ["query_knowledge_base"]
        max_tool_iterations:
          type: integer
          nullable: true
          description: Teto de ciclos modelo->tool->modelo antes de forcar uma resposta final. Default 5.
        graph_id:
          type: string
          nullable: true
          description: |
            Grafo de conhecimento (dev-graph) que a tool `find_node` deste agent
            consulta (ADR 0024). `null` ou ausente significa nenhum grafo
            configurado. Nao e validado no cadastro (existencia do grafo/acesso do
            criador) -- so em runtime, via a checagem de `graph_access` do
            graph-worker usando o usuario real da sessao.
          example: "ingredients"
        created_at:
          type: string
        updated_at:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required: [id, name, system_prompt, model, created_at, updated_at]
    AgentInput:
      type: object
      properties:
        name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer
        top_p:
          type: number
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Opcional. Nomes devem existir no catalogo fixo de tools (ADR 0023); nome desconhecido retorna 400.
        max_tool_iterations:
          type: integer
          description: Opcional. Default 5 quando omitido.
        graph_id:
          type: string
          nullable: true
          description: Opcional. Grafo usado pela tool `find_node` (ADR 0024); nao validado no cadastro.
      required: [name, system_prompt, model]
    AgentUpdateInput:
      type: object
      description: Todos os campos sao opcionais; apenas os enviados sao atualizados.
      properties:
        name:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        temperature:
          type: number
        max_tokens:
          type: integer
        top_p:
          type: number
        tools:
          type: array
          nullable: true
          items:
            type: string
          description: Nomes devem existir no catalogo fixo de tools (ADR 0023); nome desconhecido retorna 400.
        max_tool_iterations:
          type: integer
        graph_id:
          type: string
          nullable: true
          description: Grafo usado pela tool `find_node` (ADR 0024); nao validado na edicao.
    TeamMember:
      type: object
      description: Um membro de team (ADR 0025) -- referencia viva a um agent, nao um snapshot.
      properties:
        agent_id:
          type: string
          format: uuid
        order_index:
          type: integer
          description: Ordem no pipeline/rodadas do debate; preenchido (mas ignorado para sequenciamento) em orchestrator.
      required: [agent_id, order_index]
    Team:
      type: object
      description: |
        Agrupa multiplos agents e os coordena em um dos 3 modos de orquestracao
        (ADR 0025): `pipeline` (cadeia sequencial), `debate` (todos discutem, N
        rodadas) ou `orchestrator` (um coordenador decide quem fala a seguir via a
        tool sintetica `select_next_agent`). `team_members.agent_id` e uma
        referencia viva (FK real, mesmo D1 `dev-agents`) -- o team sempre executa
        com a config atual de seus membros, sem snapshot. Pode ser referenciado por
        `team_id` ao criar uma sessao de chat (mutuamente exclusivo com `agent_id`).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        orchestration_mode:
          type: string
          enum: [pipeline, debate, orchestrator]
        lead_agent_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Obrigatorio para `debate` (sintetizador/moderador) e `orchestrator`
            (coordenador); proibido em `pipeline`. Precisa ser um dos `members`.
        rounds:
          type: integer
          nullable: true
          description: Obrigatorio (teto maximo de seguranca) para `debate`; proibido nos demais modos.
        termination_strategy:
          type: string
          nullable: true
          enum: [fixed_rounds, moderator]
          description: Obrigatorio para `debate`; proibido nos demais modos.
        max_orchestrator_steps:
          type: integer
          nullable: true
          description: Teto de seguranca para `orchestrator`. Default 10 quando omitido nesse modo; proibido nos demais.
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
          description: Lista ordenada de membros. Presente no detalhe (GET /v1/teams/{id}); omitida na listagem.
        created_at:
          type: string
        updated_at:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required: [id, name, orchestration_mode, created_at, updated_at]
    TeamInput:
      type: object
      description: |
        Campos obrigatorios variam por `orchestration_mode` -- ver ADR 0025:
        `pipeline` nao aceita `lead_agent_id`/`rounds`/`termination_strategy`/
        `max_orchestrator_steps` (400 se enviados); `debate` exige `lead_agent_id`
        + `rounds` + `termination_strategy`; `orchestrator` exige `lead_agent_id`
        (`max_orchestrator_steps` default 10 se omitido). `lead_agent_id` sempre
        precisa estar em `members`.
      properties:
        name:
          type: string
        orchestration_mode:
          type: string
          enum: [pipeline, debate, orchestrator]
        members:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              agent_id:
                type: string
                format: uuid
              order_index:
                type: integer
                description: Opcional; default e a posicao do item no array.
            required: [agent_id]
        lead_agent_id:
          type: string
          format: uuid
          description: Obrigatorio para debate/orchestrator; proibido em pipeline.
        rounds:
          type: integer
          description: Obrigatorio para debate (teto maximo); proibido nos demais modos.
        termination_strategy:
          type: string
          enum: [fixed_rounds, moderator]
          description: Obrigatorio para debate; proibido nos demais modos.
        max_orchestrator_steps:
          type: integer
          description: Opcional para orchestrator, default 10; proibido nos demais modos.
      required: [name, orchestration_mode, members]
    TeamUpdateInput:
      type: object
      description: |
        Todos os campos sao opcionais; apenas os enviados sao atualizados. Enviar
        `members` substitui a lista inteira (nao ha rota para editar um membro
        individualmente). O resultado mesclado (campos existentes + atualizacoes) e
        revalidado pelas mesmas regras por modo de `TeamInput`.
      properties:
        name:
          type: string
        orchestration_mode:
          type: string
          enum: [pipeline, debate, orchestrator]
        members:
          type: array
          items:
            type: object
            properties:
              agent_id:
                type: string
                format: uuid
              order_index:
                type: integer
            required: [agent_id]
        lead_agent_id:
          type: string
          format: uuid
          nullable: true
        rounds:
          type: integer
          nullable: true
        termination_strategy:
          type: string
          nullable: true
          enum: [fixed_rounds, moderator]
        max_orchestrator_steps:
          type: integer
          nullable: true
    AccessEntry:
      type: object
      description: Linha de ACL (chat_access, agent_access, graph_access ou team_access), papel owner/editor/viewer.
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
      required: [user_id, role, created_at]
    AccessRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [owner, editor, viewer]
      required: [role]
    Graph:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_by:
          type: string
        created_at:
          type: string
        role:
          type: string
          enum: [owner, editor, viewer]
      required: [id, name, created_by, created_at]
    Node:
      type: object
      properties:
        id:
          type: string
        graph_id:
          type: string
        type:
          type: string
        label:
          type: string
        properties:
          type: object
          nullable: true
        source_document_id:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, graph_id, type, label, created_at, updated_at]
    NodeInput:
      type: object
      properties:
        id:
          type: string
          description: ID opcional fornecido pelo cliente; gerado (UUID) se omitido.
        type:
          type: string
        label:
          type: string
        properties:
          type: object
        source_document_id:
          type: string
      required: [type, label]
    NodeUpdateInput:
      type: object
      description: Atualiza apenas label e/ou properties.
      properties:
        label:
          type: string
        properties:
          type: object
    Edge:
      type: object
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        relation:
          type: string
        properties:
          type: object
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, from_node_id, to_node_id, relation, created_at, updated_at]
    EdgeInput:
      type: object
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_id:
          type: string
        relation:
          type: string
        properties:
          type: object
      required: [from_node_id, to_node_id, relation]
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: |
        Rota publica, sem autenticacao. Existe com o mesmo path literal nos 6 workers
        (`auth`, `api`, `ai`, `graph`, `rag`, `graphrag`); cada um retorna um corpo
        proprio -- ver `examples` por worker abaixo.
      tags: [auth, api, ai, graph, rag, graphrag]
      responses:
        "200":
          description: Worker saudavel. O corpo varia por worker (ver examples).
          content:
            application/json:
              schema:
                type: object
              examples:
                auth:
                  summary: auth-worker
                  value: { status: ok, service: auth, db: true }
                api:
                  summary: api-worker
                  value: { service: api, status: ok, environment: dev, authentication: "JWT Bearer Token" }
                ai:
                  summary: ai-worker
                  value: { status: ok, service: ai, version: "1.0.0" }
                graph:
                  summary: graph-worker
                  value: { service: graph, status: ok, environment: dev }
                rag:
                  summary: rag-worker
                  value:
                    service: rag
                    status: ok
                    environment: dev
                    models: { embedding: "@cf/baai/bge-base-en-v1.5", generation: "@cf/mistral/mistral-7b-instruct-v0.1" }
                    retrieval: { chunkSize: 1200, chunkOverlap: 150, topK: 5 }
                    bindings: { ai: true, vectorize: true, documents: true }
                    authenticated: false
                    timestamp: "2026-09-14T12:00:00.000Z"
                graphrag:
                  summary: graphrag-worker
                  value:
                    service: graphrag
                    status: ok
                    environment: dev
                    bindings: { rag: true, graph: true, ai: true }
  /:
    get:
      operationId: getInfo
      summary: Informacoes do servico
      description: |
        Rota publica, sem autenticacao. Existe com o mesmo path literal em `auth`,
        `api`, `ai` e `graph` (em `ai` e `graph` tambem acessivel via `GET /v1`, ver
        abaixo); cada um retorna um corpo proprio -- ver `examples` por worker.
      tags: [auth, api, ai, graph]
      responses:
        "200":
          description: Metadados do servico (versao, endpoints, autenticacao). O corpo varia por worker.
          content:
            application/json:
              schema:
                type: object
              examples:
                auth:
                  summary: auth-worker
                  value:
                    service: auth
                    version: "1.0.0"
                    database: D1
                    endpoints:
                      health: "GET /health"
                      signup: "POST /signup"
                      login: "POST /login"
                      verify: "POST /verify"
                      refresh: "POST /refresh"
                      stats: "GET /stats (requires auth + auth:stats permission)"
                    authentication: "JWT (Bearer token)"
                api:
                  summary: api-worker
                  value:
                    service: api
                    version: "1.0.0"
                    environment: dev
                    endpoints:
                      health: "GET /health"
                      info: "GET /"
                      protected: "GET /protected (requires auth)"
                      profile: "GET /profile (requires auth)"
                      recommendations: "GET /ingredients/:id/recommendations?relation=&indirect=&maxDepth= (requires auth, ingredient:read)"
                    authentication:
                      type: "JWT Bearer Token"
                      header: "Authorization: Bearer {token}"
                      token_source: "https://dev-auth.0xhackerspace.workers.dev/login"
                ai:
                  summary: ai-worker
                  value:
                    service: ai
                    version: "1.0.0"
                    description: "OpenAI-compatible AI API powered by Cloudflare Workers AI"
                    endpoints:
                      health: "GET /health"
                      info: "GET /"
                      models: "GET /v1/models"
                      chat_completions: "POST /v1/chat/completions (requires auth + ai:chat permission; body { stream: true } returns text/event-stream chat.completion.chunk events instead of a single JSON response)"
                    documentation: "https://platform.openai.com/docs/api-reference"
                graph:
                  summary: graph-worker
                  value:
                    service: graph
                    version: "1.0.0"
                    description: "Knowledge graph API: isolated graphs of entities (nodes) and relations (edges) extracted from documents"
                    environment: dev
                    endpoints:
                      health: "GET /health"
                      info: "GET /v1"
                      create_graph: "POST /v1/graphs (requires auth, creator becomes owner)"
                      list_graphs: "GET /v1/graphs (requires auth, lists graphs you have access to)"
                    authentication:
                      type: "JWT Bearer Token"
                      header: "Authorization: Bearer {token}"
  /v1:
    get:
      operationId: getInfoV1Alias
      summary: Informacoes do servico (alias de GET /)
      description: |
        Alias de `GET /` em `ai-worker` e `graph-worker` (mesmo handler, mesmo corpo).
        Rota publica, sem autenticacao.
      tags: [ai, graph]
      responses:
        "200":
          description: Mesmo corpo de `GET /` para o worker correspondente.
          content:
            application/json:
              schema:
                type: object
  /signup:
    post:
      operationId: postSignup
      summary: Cria um novo usuario
      description: Rota publica. Cria um usuario ativo na base `dev-auth`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                password:
                  type: string
                  minLength: 8
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
              required: [username, password, email]
            example:
              username: ianoliv
              email: ian.oliv@outlook.com
              password: password123
      responses:
        "201":
          description: Usuario criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      username: { type: string }
                      email: { type: string }
                      firstName: { type: string, nullable: true }
                      lastName: { type: string, nullable: true }
        "400":
          description: Campos obrigatorios ausentes/invalidos, ou username ja existente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "username already exists"
  /login:
    post:
      operationId: postLogin
      summary: Autentica um usuario e emite tokens
      description: Rota publica. Retorna access token (1h) e refresh token (7 dias).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
            example:
              username: ianoliv
              password: password123
      responses:
        "200":
          description: Login bem-sucedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      username: { type: string }
                      email: { type: string, nullable: true }
                  permissions:
                    type: array
                    items: { type: string }
                    example: ["api:access", "rag:query"]
                  profiles:
                    type: array
                    items: { type: string }
                    example: ["User"]
        "401":
          description: Credenciais invalidas ou conta inativa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Invalid credentials"
  /verify:
    post:
      operationId: postVerify
      summary: Verifica um token JWT
      description: Rota publica; o token e enviado no corpo (nao no header Authorization).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Token valido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  payload: { type: object }
                  user:
                    type: object
                    properties:
                      username: { type: string }
        "401":
          description: Token invalido ou expirado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Invalid or expired token"
  /refresh:
    post:
      operationId: postRefresh
      summary: Emite um novo access token a partir de um refresh token
      description: Rota publica; o refresh token e enviado no corpo.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
              required: [refresh_token]
      responses:
        "200":
          description: Novo access token emitido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
        "401":
          description: Refresh token invalido, expirado, ou nao e do tipo "refresh".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Invalid or expired refresh token"
  /stats:
    get:
      operationId: getStats
      summary: Estatisticas agregadas de usuarios
      description: Requer JWT + permission `auth:stats` (tipicamente perfil Admin).
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estatisticas agregadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users: { type: integer }
                  active_users: { type: integer }
                  database: { type: string, example: D1 }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Missing authorization token"
        "403":
          description: Token valido mas sem a permission `auth:stats`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Missing required permission: auth:stats"
  /protected:
    get:
      operationId: getProtected
      summary: Recurso protegido de demonstracao
      description: Requer JWT + permission `api:access`. Faz eco de informacoes do token.
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso concedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    type: object
                    properties:
                      sub: { type: string }
                      username: { type: string }
                  token_info:
                    type: object
                    properties:
                      issued_at: { type: string }
                      expires_at: { type: string }
                      type: { type: string }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Missing authorization token"
  /profile:
    get:
      operationId: getProfile
      summary: Perfil derivado do token JWT
      description: Requer JWT + permission `api:access`.
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil do usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    type: object
                    properties:
                      username: { type: string }
                      subject: { type: string }
                      authenticated: { type: boolean }
                      token_type: { type: string }
                      issued_at: { type: string }
                      expires_at: { type: string }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /ingredients:
    get:
      operationId: getIngredients
      summary: Lista todos os ingredientes
      description: Requer JWT + permission `ingredient:read`.
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de ingredientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ingredient"
                  count: { type: integer }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "403":
          description: Token valido mas sem a permission `ingredient:read`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
    post:
      operationId: postIngredients
      summary: Cria um ingrediente
      description: Requer JWT + permission `ingredient:create`.
      tags: [api]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientInput"
            examples:
              full:
                summary: Com todos os campos opcionais
                value:
                  nome: Alho
                  slug: alho
                  type: tempero
                  reference: "https://en.wikipedia.org/wiki/Garlic"
                  url: "https://example.com/alho"
                  permissions: public
              minimal:
                summary: Apenas campos obrigatorios
                value:
                  nome: Cebola
                  slug: cebola
                  type: vegetal
      responses:
        "201":
          description: Ingrediente criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Ingredient"
        "400":
          description: Campos obrigatorios ausentes (nome, slug, type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Missing required fields: nome, slug, type"
        "409":
          description: Ja existe um ingrediente com esse slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Ingredient with this slug already exists"
  /ingredients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIngredientById
      summary: Busca um ingrediente por ID
      description: Requer JWT + permission `ingredient:read`.
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ingrediente encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Ingredient"
        "404":
          description: Ingrediente nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Ingredient not found"
    put:
      operationId: putIngredientById
      summary: Atualiza um ingrediente
      description: Requer JWT + permission `ingredient:update`.
      tags: [api]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngredientUpdateInput"
            example:
              nome: "Alho fresco"
              reference: "https://pt.wikipedia.org/wiki/Alho"
      responses:
        "200":
          description: Ingrediente atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Ingredient"
        "404":
          description: Ingrediente nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Ingredient not found"
        "409":
          description: Novo slug ja usado por outro ingrediente.
          content:
