  /v1/graphs/{graphId}/nodes/{id}/paths:
    parameters:
      - name: graphId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
        description: Quando omitido, retorna todos os nodes alcancaveis (modo "reachable").
      - name: maxDepth
        in: query
        required: false
        schema:
          type: integer
          default: 3
          minimum: 1
          maximum: 6
        description: Clampado no intervalo 1-6 (nao gera erro fora do range).
      - name: relation
        in: query
        required: false
        schema:
          type: string
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum: [any, out, in]
    get:
      operationId: getV1GraphNodePaths
      summary: Travessia multi-hop a partir de um node
      description: "Requer JWT + permission `graph:read`. Papel minimo no grafo: `viewer`."
      tags: [graph]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nodes alcancaveis ("reachable") ou caminhos ate um node especifico ("paths").
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  mode: { type: string, enum: [reachable, paths] }
                  data:
                    type: array
                    items:
                      type: object
                  count: { type: integer }
        "404":
          description: Node de origem, grafo, ou node "to" inexistente no grafo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "to node not found in this graph", type: invalid_request_error }
  /v1/graphs/{graphId}/access:
