                    $ref: "#/components/schemas/Node"
        "400":
          description: Campo obrigatorio ausente (type/label).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "Missing required field: label", type: invalid_request_error }
        "404":
          description: Grafo inexistente.
          content:
            application/json:
              schema:
