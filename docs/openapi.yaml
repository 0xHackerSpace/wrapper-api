        "200":
          description: Ingrediente removido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/Ingredient"
                  message: { type: string, example: "Ingredient deleted successfully" }
        "404":
          description: Ingrediente nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Ingredient not found"
  /ingredients/{id}/recommendations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: relation
        in: query
        required: false
        schema:
          type: string
        description: Filtra por tipo de relacao (ex. "pairs_well_with").
      - name: indirect
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Quando true, usa travessia multi-hop (findPaths) em vez de vizinhos diretos.
      - name: maxDepth
        in: query
        required: false
        schema:
          type: integer
          default: 2
        description: Profundidade maxima da travessia quando indirect=true.
    get:
      operationId: getIngredientRecommendations
      summary: Recomendacoes de ingredientes via grafo de conhecimento
      description: |
        Requer JWT + permission `ingredient:read`. Consome graph-worker via Service
        Binding (RPC `getNeighbors`/`findPaths`) para montar a lista. Retorna
        `{ success: true, data: [], count: 0 }` quando o ingrediente ainda nao tem
        node correspondente no grafo (nao e um erro).
      tags: [api]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de recomendacoes (diretas ou indiretas).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  mode: { type: string, enum: [direct, indirect] }
                  data:
                    type: array
                    items:
                      type: object
                  count: { type: integer }
        "404":
          description: Ingrediente nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                error: "Ingredient not found"
  /v1/models:
    get:
      operationId: getV1Models
      summary: Lista modelos disponiveis
      description: Rota publica, sem autenticacao. Formato compativel com OpenAI `GET /v1/models`.
      tags: [ai]
      responses:
        "200":
          description: Lista de modelos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string, example: model }
                        owned_by: { type: string, example: cloudflare }
                        permission:
                          type: array
                          items: {}
              example:
                object: list
                data:
                  - id: "@cf/meta/llama-2-7b-chat-int8"
                    object: model
                    owned_by: cloudflare
                    permission: []
                  - id: "@cf/mistral/mistral-7b-instruct-v0.1"
                    object: model
                    owned_by: cloudflare
                    permission: []
                  - id: "@cf/baai/bge-base-en-v1.5"
                    object: model
                    owned_by: cloudflare
                    permission: []
  /v1/chat/completions:
    post:
      operationId: postV1ChatCompletions
      summary: Chat completion (compativel com OpenAI)
      description: |
        Requer JWT + permission `ai:chat`. Quando `stream: true`, a resposta e
        `text/event-stream` com eventos `chat.completion.chunk` (formato SSE de streaming
        da OpenAI) em vez de um unico JSON.
      tags: [ai]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChatCompletionMessageInput"
                model:
                  type: string
                  default: "@cf/meta/llama-2-7b-chat-int8"
                temperature:
                  type: number
                  default: 0.7
                max_tokens:
                  type: integer
                  default: 1024
                top_p:
                  type: number
                  default: 1
                stream:
                  type: boolean
                  default: false
              required: [messages]
            examples:
              withSystemMessage:
                summary: Com instrucao de sistema
                value:
                  model: "@cf/mistral/mistral-7b-instruct-v0.1"
                  messages:
                    - role: system
                      content: "Você é um assistente útil e amigável que responde perguntas de forma clara e concisa.me responda apenas em português."
                    - role: user
                      content: "qual a capital da França?"
                  temperature: 0.7
                  max_tokens: 512
              minimal:
                summary: Minimo (sem system message)
                value:
                  messages:
                    - role: user
                      content: "Explique como fazer uma receita de alho"
              streaming:
                summary: Com stream (SSE chat.completion.chunk)
                value:
                  messages:
                    - role: user
                      content: "Explique como fazer uma receita de alho"
                  stream: true
      responses:
        "200":
          description: |
            Chat completion no formato OpenAI, ou (quando `stream: true`) um
            `text/event-stream` de eventos `chat.completion.chunk` terminado por `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  object: { type: string, example: chat.completion }
                  created: { type: integer }
                  model: { type: string }
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        message:
                          type: object
                          properties:
                            role: { type: string, example: assistant }
                            content: { type: string }
                        finish_reason: { type: string, example: stop }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
            text/event-stream:
              schema:
                type: string
                description: |
                  Sequencia de linhas `data: {"id":...,"object":"chat.completion.chunk",...}`,
                  finalizada por `data: [DONE]`.
        "400":
          description: Corpo invalido (messages ausente/vazio, role invalida, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "messages is required and must be an array", type: invalid_request_error }
        "401":
          description: Sem token de autenticacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Token valido mas sem a permission `ai:chat`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/sessions:
    post:
      operationId: postV1Sessions
      summary: Cria uma sessao de chat, opcionalmente a partir de um agent ou de um team
      description: |
        Requer JWT + permission `ai:chat`. O criador vira `owner` da sessao. Corpo
        opcional com `agent_id`: requer papel `viewer`+ em `agent_access` para aquele
        agent (404 se inexistente ou sem acesso) e copia seu `system_prompt`/`model`/
        `temperature`/`max_tokens`/`top_p`/`tools`/`max_tool_iterations`/`graph_id`
        como snapshot congelado na sessao (ADR 0022/0023/0024) -- editar ou apagar o
        agent depois nao afeta a sessao ja criada.

        Alternativamente, corpo opcional com `team_id` (ADR 0025): requer papel
        `viewer`+ em `team_access` para aquele team (404 se inexistente ou sem
        acesso), mas **sem snapshot** -- `team_id` e gravado como referencia viva, e
        a sessao sempre executa com a config atual do team (membros, modo de
        orquestracao) na proxima mensagem enviada. `agent_id` e `team_id` sao
        **mutuamente exclusivos**: enviar os dois retorna `400`. Sem nenhum dos
        dois, comportamento inalterado.
      tags: [ai]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  format: uuid
                team_id:
                  type: string
                  format: uuid
              example: {}
            examples:
              vazia:
                summary: Sessao sem agent nem team
                value: {}
              com_agent:
                summary: Sessao a partir de um agent (snapshot congelado)
                value:
                  agent_id: "8f14e45f-ceea-467e-b91a-fbc86eb1cec6"
              com_team:
                summary: Sessao a partir de um team (referencia viva, sem snapshot)
                value:
                  team_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "201":
          description: Sessao criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string, nullable: true, example: null }
                  agent_id: { type: string, format: uuid, nullable: true }
                  team_id: { type: string, format: uuid, nullable: true }
                  created_at: { type: string }
        "400":
          description: "`agent_id` e `team_id` enviados ao mesmo tempo (mutuamente exclusivos)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "agent_id and team_id are mutually exclusive", type: invalid_request_error }
        "404":
          description: "`agent_id` ou `team_id` informado, mas inexistente ou sem acesso (`agent_access`/`team_access`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "Agent not found", type: invalid_request_error }
    get:
      operationId: getV1Sessions
      summary: Lista sessoes de chat do usuario autenticado
      description: |
        Requer JWT + permission `ai:chat`. Lista sessoes onde o usuario tem qualquer
        papel em `chat_access` (owner/editor/viewer), ordenadas por `updated_at` desc.
        Paginacao por cursor opaco (keyset).
      tags: [ai]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Pagina de sessoes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatSession"
                  next_cursor:
                    type: string
                    nullable: true
  /v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getV1SessionById
      summary: Metadados de uma sessao (sem mensagens)
      description: |
        Requer JWT + permission `ai:chat`. Papel minimo na sessao: `viewer`. 404 quando
        a sessao nao existe OU quando o usuario nao tem `chat_access` a ela (para nao
        vazar a existencia do id).
      tags: [ai]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessao encontrada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ChatSession"
        "404":
          description: Sessao inexistente ou sem chat_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "Session not found", type: invalid_request_error }
    patch:
      operationId: patchV1SessionById
      summary: Renomeia uma sessao
      description: "Requer JWT + permission `ai:chat`. Papel minimo na sessao: `editor`."
      tags: [ai]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
              required: [title]
            example:
              title: "Receitas com alho"
      responses:
        "200":
          description: Sessao renomeada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "404":
          description: Sessao inexistente ou sem chat_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteV1SessionById
      summary: Remove uma sessao
      description: |
        Requer JWT + permission `ai:chat`. Papel minimo na sessao: `owner`. Cascateia
        para `chat_messages` e `chat_access` (ON DELETE CASCADE).
      tags: [ai]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessao removida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "404":
          description: Sessao inexistente ou sem chat_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/sessions/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: postV1SessionMessages
      summary: Envia uma mensagem na sessao
      description: |
        Requer JWT + permission `ai:chat`. Papel minimo na sessao: `editor`. Persiste o
        turno usuario+assistente; o titulo da sessao e preenchido automaticamente no
        primeiro envio. Quando `stream: true`, a resposta e SSE (`chat.completion.chunk`)
        e a mensagem do assistant so e persistida apos o streaming terminar com sucesso.
        Quando a sessao referencia um agent com `tools` habilitado (ADR 0023), o envio
        pode envolver um ou mais ciclos internos de tool calling (modelo -> tool ->
        modelo, ate `max_tool_iterations`) antes da resposta final -- cada ciclo e
        persistido como mensagens extras `role: "assistant"` (pedido de tool call) e
        `role: "tool"` (resultado ou erro) no historico da sessao, visiveis via
        `GET /v1/sessions/{id}/messages` mas nao inline nesta resposta. Isso funciona
        tanto com `stream: true` quanto sem -- o loop roda sempre internamente sem
        streaming, e so a resposta final e enviada como stream quando pedido.
      tags: [ai]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                model:
                  type: string
                stream:
                  type: boolean
                  default: false
              required: [content]
            examples:
              default:
                summary: Envio simples
                value:
                  content: "Explique como fazer uma receita de alho"
                  model: "@cf/mistral/mistral-7b-instruct-v0.1"
              streaming:
                summary: Com stream (SSE)
                value:
                  content: "Explique como fazer uma receita de alho"
                  model: "@cf/mistral/mistral-7b-instruct-v0.1"
                  stream: true
      responses:
        "200":
          description: |
            Resposta do assistant, ou (quando `stream: true`) `text/event-stream` de
            eventos `chat.completion.chunk` terminado por `data: [DONE]`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string, format: uuid }
                  message:
                    type: object
                    properties:
                      role: { type: string, example: assistant }
                      content: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
            text/event-stream:
              schema:
                type: string
        "403":
          description: |
            Papel insuficiente na sessao (ex. `viewer` tentando enviar mensagem) --
            403, nao 404, ja que o usuario ja sabe que a sessao existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: { message: "Insufficient role for this session", type: invalid_request_error }
        "404":
          description: Sessao inexistente ou sem chat_access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getV1SessionMessages
      summary: Historico de mensagens da sessao, paginado
      description: |
        Requer JWT + permission `ai:chat`. Papel minimo na sessao: `viewer`. Ordenado por
        `created_at` asc. Paginacao por cursor opaco (keyset).
      tags: [ai]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
